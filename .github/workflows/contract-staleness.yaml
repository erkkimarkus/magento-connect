# Contract staleness guard (PRO-1252; Decision A on PRO-1247).
#
# Fails when this repo's vendored docs/RECENGINE_API_CONTRACT.md is no longer
# byte-identical with the engine repo's (erkkimarkus/smaily-recommendations)
# main-branch copy. Same pattern as the WooCommerce connect repo (PRO-1250);
# kept as its OWN workflow so the staleness signal stays unambiguous and the
# daily schedule does not re-run the full CI matrix.
#
# The schedule is the real guard: contract drift usually arrives with no push
# on OUR side, so push/PR triggers alone would never see it.
#
# Needs the repo secret ENGINE_CONTRACT_READ_TOKEN — a fine-grained PAT with
# contents:read on erkkimarkus/smaily-recommendations (the engine repo is
# private). Missing/expired secret fails with a "CANNOT CHECK" message, which
# is distinct from "CONTRACT COPY STALE".
#
# On red: sync the vendored copy byte-identically from the engine repo and
# carry any contract changes through to code and test fixtures in the same pass.

name: Contract staleness

on:
  push:
    branches: [v3, master]
  pull_request:
  schedule:
    # Daily 05:23 UTC — odd minute to avoid the on-the-hour GH cron pile-up,
    # offset from the WooCommerce repo's 05:17 run.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: RECENGINE_API_CONTRACT.md vs engine main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compare vendored contract against engine main
        env:
          ENGINE_CONTRACT_READ_TOKEN: ${{ secrets.ENGINE_CONTRACT_READ_TOKEN }}
        run: bash bin/check-contract-staleness.sh
