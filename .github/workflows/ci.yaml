name: CI

on:
  push:
    branches: [v3, master]
  pull_request:

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Add Mage-OS mirror for Magento packages
        run: composer config repositories.mage-os composer https://repo.mage-os.org/

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  static:
    name: Static analysis (phpcs + phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Add Mage-OS mirror for Magento packages
        run: composer config repositories.mage-os composer https://repo.mage-os.org/

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: phpcs (Magento2 standard)
        run: vendor/bin/phpcs

      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress
