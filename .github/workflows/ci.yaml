name: CI

on:
  push:
    branches: [v3, master]
  pull_request:

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Add Mage-OS mirror for Magento packages
        run: composer config repositories.mage-os composer https://mirror.mage-os.org/

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smaily_connect_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, soap, sodium, xsl, zip
          coverage: none

      - name: Add Mage-OS mirror for Magento packages
        run: composer config repositories.mage-os composer https://mirror.mage-os.org/

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run integration tests
        run: vendor/bin/phpunit -c phpunit.integration.xml.dist
        env:
          SMAILY_IT_DB_HOST: 127.0.0.1
          SMAILY_IT_DB_PORT: '3306'
          SMAILY_IT_DB_USER: root
          SMAILY_IT_DB_PASSWORD: root
          SMAILY_IT_DB_NAME: smaily_connect_it

  static:
    name: Static analysis (phpcs + phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Add Mage-OS mirror for Magento packages
        run: composer config repositories.mage-os composer https://mirror.mage-os.org/

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: phpcs (Magento2 standard)
        run: vendor/bin/phpcs

      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

  package:
    name: Release package (build + verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build and verify the release ZIP
        run: bash bin/verify-release-zip.sh smaily-connect-magento2.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            smaily-connect-magento2.zip
            smaily-connect-magento2.zip.sha256
          retention-days: 5
