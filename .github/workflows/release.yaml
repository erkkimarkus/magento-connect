name: Build a release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: |
          zip -r smaily-connect-magento2.zip . \
            -x '.git/*' '.github/*' '.sandbox/*' '.vscode/*' \
               'Test/*' 'compat/*' 'vendor/*' 'var/*' \
               'docker-compose.yaml' 'Dockerfile' \
               'phpcs.xml.dist' 'phpstan.neon.dist' 'phpunit.xml.dist' \
               'composer.lock' 'CONTRIBUTING.md' '.gitignore'

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" smaily-connect-magento2.zip --clobber
