name: Build a release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4

      - name: Build and verify the release ZIP
        run: bash bin/verify-release-zip.sh smaily-connect-magento2.zip

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" smaily-connect-magento2.zip --clobber
